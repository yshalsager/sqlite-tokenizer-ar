name: release-build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sqlite_ref:
        description: 'SQLite source ref/tag/branch for WASM build; blank uses mise.toml SQLITE_TOKENIZER_AR_SQLITE_REF'
        required: false
        default: ''
      cache_bust:
        description: 'Optional cache-bust token appended to cache keys'
        required: false
        default: ''
      use_ccache:
        description: 'Enable optional ccache for tokenizer compilation'
        required: false
        default: 'false'
      run_sqlite_compat:
        description: 'Run SQLite runtime compatibility smoke matrix'
        required: false
        default: 'true'
      publish_npm:
        description: 'Publish the WASM package to GitHub Packages'
        required: false
        default: 'false'

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_label: ${{ steps.vars.outputs.release_label }}
      cache_bust: ${{ steps.vars.outputs.cache_bust }}
      sqlite_ref: ${{ steps.vars.outputs.sqlite_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise toolchain
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        with:
          version: 2026.11.2
          install: true
          cache: true
          cache_key_prefix: mise-release-v1

      - name: Resolve build variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          eval "$(mise env -s bash)"

          sqlite_ref='${{ github.event.inputs.sqlite_ref }}'
          if [[ -z "${sqlite_ref}" ]]; then
            sqlite_ref="${SQLITE_TOKENIZER_AR_SQLITE_REF}"
          fi
          android_ndk_version="${SQLITE_TOKENIZER_AR_ANDROID_NDK_VERSION}"
          safe_ref="$(printf '%s' "${sqlite_ref}" | tr '/:@ ' '_')"
          sqlite_src_dir="${GITHUB_WORKSPACE}/.build-tools/sqlite-src/${safe_ref}"

          cache_bust='${{ github.event.inputs.cache_bust }}'
          if [[ -z "${cache_bust}" ]]; then
            cache_bust='none'
          fi

          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            release_label="${GITHUB_REF_NAME}"
          else
            release_label="manual-${GITHUB_RUN_ID}"
          fi

          echo "sqlite_ref=${sqlite_ref}" >> "${GITHUB_OUTPUT}"
          echo "sqlite_src_dir=${sqlite_src_dir}" >> "${GITHUB_OUTPUT}"
          echo "cache_bust=${cache_bust}" >> "${GITHUB_OUTPUT}"
          echo "release_label=${release_label}" >> "${GITHUB_OUTPUT}"
          echo "android_ndk_version=${android_ndk_version}" >> "${GITHUB_OUTPUT}"

      - name: Install OS build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libsqlite3-dev git wabt

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android NDK
        shell: bash
        run: sdkmanager "ndk;${{ steps.vars.outputs.android_ndk_version }}"

      - name: Cache SQLite source tree
        id: cache_sqlite_source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.vars.outputs.sqlite_src_dir }}
          key: sqlite-source-${{ runner.os }}-${{ steps.vars.outputs.sqlite_ref }}-${{ steps.vars.outputs.cache_bust }}

      - name: Fetch SQLite source
        if: steps.cache_sqlite_source.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          sqlite_ref='${{ steps.vars.outputs.sqlite_ref }}'
          sqlite_src_dir='${{ steps.vars.outputs.sqlite_src_dir }}'

          mkdir -p "${sqlite_src_dir}"
          if [[ ! -d "${sqlite_src_dir}/.git" ]]; then
            git -C "${sqlite_src_dir}" init
          fi

          if git -C "${sqlite_src_dir}" remote get-url origin >/dev/null 2>&1; then
            git -C "${sqlite_src_dir}" remote set-url origin https://github.com/sqlite/sqlite.git
          else
            git -C "${sqlite_src_dir}" remote add origin https://github.com/sqlite/sqlite.git
          fi

          git -C "${sqlite_src_dir}" fetch --depth 1 origin "${sqlite_ref}"
          git -C "${sqlite_src_dir}" checkout --force FETCH_HEAD
          git -C "${sqlite_src_dir}" clean -fdx

      - name: Install ccache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_ccache == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache

      - name: Cache ccache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_ccache == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('tokenizer/src/sqlite_tokenizer_ar.c') }}-${{ steps.vars.outputs.cache_bust }}

      - name: Build tokenizer extension
        shell: bash
        run: |
          set -euo pipefail
          use_ccache='${{ github.event_name == 'workflow_dispatch' && inputs.use_ccache == 'true' }}'
          if [[ "${use_ccache}" == 'true' ]]; then
            export CC='ccache cc'
            ccache --zero-stats || true
          fi

          mise run tokenizer:build

          if [[ "${use_ccache}" == 'true' ]]; then
            ccache --show-stats || true
          fi

      - name: Cache WASM bundle
        id: cache_wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: playground/sqlite-wasm-custom
          key: wasm-bundle-${{ runner.os }}-${{ steps.vars.outputs.sqlite_ref }}-${{ hashFiles('tokenizer/src/**', 'playground/scripts/build_custom_wasm.sh', 'playground/scripts/verify_custom_wasm.sh') }}-${{ steps.vars.outputs.cache_bust }}

      - name: Build custom WASM bundle
        if: steps.cache_wasm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          SQLITE_SRC_DIR='${{ steps.vars.outputs.sqlite_src_dir }}' mise -C playground run build-wasm

      - name: Verify custom WASM bundle integrity
        shell: bash
        run: ./playground/scripts/verify_custom_wasm.sh

      - name: Pack npm WASM package
        shell: bash
        run: |
          set -euo pipefail
          mise run wasm:package
          npm run smoke:node

      - name: Create checksum for tokenizer artifact
        shell: bash
        run: |
          set -euo pipefail
          sha256sum tokenizer/build/sqlite_tokenizer_ar.so > tokenizer/build/sqlite_tokenizer_ar.so.sha256
          tar -C tokenizer/build -czf tokenizer/build/sqlite-tokenizer-ar-linux-x64.tar.gz sqlite_tokenizer_ar.so

      - name: Build Android tokenizer extensions
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${{ steps.vars.outputs.android_ndk_version }}"
          SQLITE_SRC_DIR='${{ steps.vars.outputs.sqlite_src_dir }}' mise run tokenizer:build-android
          (cd tokenizer/build && python3 -m zipfile -c sqlite-tokenizer-ar-android.zip android)

      - name: Upload tokenizer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tokenizer-linux-${{ steps.vars.outputs.release_label }}
          if-no-files-found: error
          path: |
            tokenizer/build/sqlite_tokenizer_ar.so
            tokenizer/build/sqlite_tokenizer_ar.so.sha256
            tokenizer/build/sqlite-tokenizer-ar-linux-x64.tar.gz

      - name: Upload WASM bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sqlite-wasm-custom-${{ steps.vars.outputs.release_label }}
          if-no-files-found: error
          path: |
            playground/sqlite-wasm-custom/sqlite3.wasm
            playground/sqlite-wasm-custom/sqlite3.mjs
            playground/sqlite-wasm-custom/sqlite3-node.mjs
            playground/sqlite-wasm-custom/sqlite3-worker1.js
            playground/sqlite-wasm-custom/sqlite3-worker1.mjs
            playground/sqlite-wasm-custom/sqlite3-opfs-async-proxy.js
            playground/sqlite-wasm-custom/SHA256SUMS

      - name: Upload Android tokenizer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tokenizer-android-${{ steps.vars.outputs.release_label }}
          if-no-files-found: error
          path: tokenizer/build/sqlite-tokenizer-ar-android.zip

      - name: Upload npm WASM package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sqlite-tokenizer-ar-wasm-npm-${{ steps.vars.outputs.release_label }}
          if-no-files-found: error
          path: '*.tgz'

      - name: Publish npm WASM package to GitHub Packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo '@yshalsager:registry=https://npm.pkg.github.com' > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          npm publish --registry=https://npm.pkg.github.com --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise toolchain
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        with:
          version: 2026.11.2
          install: true
          cache: true
          cache_key_prefix: mise-release-v1

      - name: Build and test macOS tokenizer extension
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == 'arm64' ]]
          mise run tokenizer:build
          tokenizer/scripts/check_macos_deployment_target.sh 13.0
          mise x -- python tokenizer/scripts/smoke_test.py
          file tokenizer/build/sqlite_tokenizer_ar.so | grep -q 'Mach-O 64-bit.*arm64'
          tar -C tokenizer/build -czf tokenizer/build/sqlite-tokenizer-ar-macos-arm64.tar.gz sqlite_tokenizer_ar.so

      - name: Build iOS XCFramework
        shell: bash
        run: mise run tokenizer:build-ios

      - name: Upload iOS tokenizer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tokenizer-ios-${{ needs.build.outputs.release_label }}
          if-no-files-found: error
          path: tokenizer/build/ios/sqlite-tokenizer-ar-ios.xcframework.zip

      - name: Upload macOS tokenizer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tokenizer-macos-arm64-${{ needs.build.outputs.release_label }}
          if-no-files-found: error
          path: tokenizer/build/sqlite-tokenizer-ar-macos-arm64.tar.gz

      - name: Run iOS simulator smoke
        continue-on-error: true
        shell: bash
        run: tokenizer/scripts/smoke_ios_simulator.sh

  build-linux-arm64:
    needs: build
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise toolchain
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5
        with:
          version: 2026.11.2
          install: true
          cache: true
          cache_key_prefix: mise-release-v1

      - name: Install OS build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libsqlite3-dev

      - name: Build and test Linux arm64 tokenizer extension
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == 'aarch64' ]]
          mise run tokenizer:build
          mise x -- python tokenizer/scripts/smoke_test.py
          file tokenizer/build/sqlite_tokenizer_ar.so | grep -q 'ELF 64-bit.*ARM aarch64'
          tar -C tokenizer/build -czf tokenizer/build/sqlite-tokenizer-ar-linux-arm64.tar.gz sqlite_tokenizer_ar.so

      - name: Upload Linux arm64 tokenizer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tokenizer-linux-arm64-${{ needs.build.outputs.release_label }}
          if-no-files-found: error
          path: tokenizer/build/sqlite-tokenizer-ar-linux-arm64.tar.gz

  build-windows-x64:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sqlite3

      - name: Build and test Windows x64 tokenizer extension
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p tokenizer/build
          gcc -O2 -shared -Wall -Wextra -Ivendor/sqlite tokenizer/src/sqlite_tokenizer_ar.c -lm -o tokenizer/build/sqlite_tokenizer_ar.dll
          file tokenizer/build/sqlite_tokenizer_ar.dll | grep -q 'PE32+ executable.*x86-64'
          dll_path="$(cygpath -m "$PWD/tokenizer/build/sqlite_tokenizer_ar.dll")"
          output="$(
            {
              printf '.load %s\n' "$dll_path"
              printf "SELECT sqlite_compileoption_used('ENABLE_FTS5');\n"
              printf "CREATE VIRTUAL TABLE t USING fts5(content, tokenize='sqlite_tokenizer_ar');\n"
              printf "INSERT INTO t(content) VALUES('قُرْآن كريم');\n"
              printf "SELECT count(*) FROM t WHERE t MATCH 'قران';\n"
              printf "SELECT sqlite_tokenizer_ar_normalize('قُرْآن ١٢٣',1,1,1,1,0,0);\n"
            } | sqlite3 -batch -noheader :memory: | tr -d '\r'
          )"
          [[ "$output" == $'1\n1\nقران 123' ]]
          tar -C tokenizer/build -czf tokenizer/build/sqlite-tokenizer-ar-windows-x64.tar.gz sqlite_tokenizer_ar.dll

      - name: Upload Windows x64 tokenizer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tokenizer-windows-x64-${{ needs.build.outputs.release_label }}
          if-no-files-found: error
          path: tokenizer/build/sqlite-tokenizer-ar-windows-x64.tar.gz

  publish-release:
    needs: [build, build-ios, build-linux-arm64, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-${{ needs.build.outputs.release_label }}'
          merge-multiple: true
          path: release-assets

      - name: Create release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS

      - name: Publish release assets (tag runs)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: release-assets/*

  sqlite-compat-smoke:
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_sqlite_compat == 'true') }}
    uses: ./.github/workflows/sqlite-compat.yml
    with:
      sqlite_ref: ${{ needs.build.outputs.sqlite_ref }}
