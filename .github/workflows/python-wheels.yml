name: python-wheels

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'hatch_build.py'
      - 'sqlite_tokenizer_ar/**'
      - 'mise.toml'
      - 'tokenizer/**'
      - 'vendor/sqlite/**'
      - 'query_compat/**'
      - 'tests/**'
      - '.github/workflows/python-wheels.yml'
      - '.github/workflows/smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/smoke.yml

  sqlite-compat:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/sqlite-compat.yml

  wheels:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:9555ba6c479fa69a2aa80ad1dc57154a60d562b19df159361d9379a02beb1e36
            platform: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
            platform: manylinux_2_28_aarch64
          - os: macos-latest
            platform: macosx_11_0_arm64
            macos-target: '11.0'
          - os: macos-15-intel
            platform: macosx_10_13_x86_64
            macos-target: '10.13'
          - os: windows-latest
            platform: win_amd64
    env:
      UV_MANAGED_PYTHON: 'true'
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-target }}
      WHEEL_PLATFORM: ${{ matrix.platform }}
      SQLITE_TOKENIZER_AR_BINARY: tokenizer/build/sqlite_tokenizer_ar.${{ matrix.platform == 'win_amd64' && 'dll' || 'so' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
      - name: Check version
        run: |
          uv run --no-project python -c "
          import json, os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert version == json.load(open('package.json'))['version'], 'Python/npm versions differ'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF'] == 'refs/tags/v' + version, 'Select the matching version tag'
          "
      - name: Build Linux extension
        if: runner.os == 'Linux'
        run: |
          mkdir -p tokenizer/build
          cc -O2 -fPIC -shared -Wall -Wextra -Ivendor/sqlite tokenizer/src/sqlite_tokenizer_ar.c -lm -o "$SQLITE_TOKENIZER_AR_BINARY"
      - name: Build macOS extension
        if: runner.os == 'macOS'
        run: |
          mkdir -p tokenizer/build
          cc -O2 -fPIC -dynamiclib -undefined dynamic_lookup -Wall -Wextra -Ivendor/sqlite \
            tokenizer/src/sqlite_tokenizer_ar.c -o "$SQLITE_TOKENIZER_AR_BINARY"
      - name: Setup Windows compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Build Windows extension
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p tokenizer/build
          gcc -O2 -shared -Wall -Wextra -Ivendor/sqlite tokenizer/src/sqlite_tokenizer_ar.c -lm -o "$SQLITE_TOKENIZER_AR_BINARY"
      - name: Test wheel build checks
        run: uv run --no-project --with hatchling python -m unittest discover -s tests -p test_wheel_build.py
      - name: Build wheel
        run: uv build --wheel
      - name: Inspect Linux dependencies
        if: runner.os == 'Linux'
        run: uvx auditwheel show dist/*.whl
      - name: Check metadata and installed wheel
        run: |
          uvx twine check --strict dist/*.whl
          uv run --isolated --no-project --with dist/*.whl python -I tests/test_python_wheel.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tests, sqlite-compat, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Publish five native wheels
        env:
          UV_PUBLISH_CHECK_URL: https://pypi.org/simple/
        run: |
          test "$(find dist -name '*.whl' | wc -l)" -eq 5
          uv publish --trusted-publishing always dist/*.whl
